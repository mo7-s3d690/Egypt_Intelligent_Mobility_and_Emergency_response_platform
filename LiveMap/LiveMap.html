/* =========================================================
   TRAFFIC INCIDENTS / ROAD CONDITIONS
========================================================= */

function clearTrafficIncidents() {

    trafficIncidentLayers.forEach(layer => {
        if (layer && map.hasLayer(layer)) {
            map.removeLayer(layer);
        }
    });

    trafficIncidentLayers = [];
}


function getTrafficIncidentInfo(incident) {

    const properties = incident?.properties || {};

    const events = Array.isArray(properties.events)
        ? properties.events
        : [];

    const event = events[0] || {};

    const iconCategory = Number(
        properties.iconCategory ?? event.iconCategory
    );

    const categories = {
        0: { icon: "⚠️", title: "حالة مرورية" },
        1: { icon: "🚨", title: "حادث مروري" },
        2: { icon: "🌫️", title: "ضباب" },
        3: { icon: "⚠️", title: "ظروف خطرة" },
        4: { icon: "🌧️", title: "أمطار" },
        5: { icon: "🧊", title: "جليد" },
        6: { icon: "🚗", title: "ازدحام مروري" },
        7: { icon: "🚧", title: "حارة مغلقة" },
        8: { icon: "⛔", title: "طريق مغلق" },
        9: { icon: "🚧", title: "أعمال طرق" },
        10: { icon: "💨", title: "رياح قوية" },
        11: { icon: "🌊", title: "سيول / مياه على الطريق" },
        14: { icon: "🚙", title: "مركبة متعطلة" }
    };

    const category = categories[iconCategory] || categories[0];

    const description =
        event.description ||
        properties.description ||
        category.title;

    return {
        icon: category.icon,
        title: category.title,
        description,
        delay: properties.delay,
        from: properties.from,
        to: properties.to,
        roadNumbers: Array.isArray(properties.roadNumbers)
            ? properties.roadNumbers.join("، ")
            : properties.roadNumbers,
        startTime: properties.startTime,
        endTime: properties.endTime,
        iconCategory,
        eventCode: event.code || ""
    };
}

function getIncidentPoint(geometry) {

    if (!geometry || !geometry.coordinates) {
        return null;
    }

    const coordinates = geometry.coordinates;

    // Point: [lon, lat]
    if (
        geometry.type === "Point" &&
        Array.isArray(coordinates) &&
        coordinates.length >= 2
    ) {
        return [coordinates[1], coordinates[0]];
    }

    // LineString: [[lon, lat], ...]
    if (
        geometry.type === "LineString" &&
        Array.isArray(coordinates) &&
        coordinates.length
    ) {
        const middle = coordinates[Math.floor(coordinates.length / 2)];
        return middle ? [middle[1], middle[0]] : null;
    }

    // MultiLineString: [[[lon, lat], ...], ...]
    if (
        geometry.type === "MultiLineString" &&
        Array.isArray(coordinates) &&
        coordinates.length &&
        coordinates[0]?.length
    ) {
        const line = coordinates[0];
        const middle = line[Math.floor(line.length / 2)];
        return middle ? [middle[1], middle[0]] : null;
    }

    return null;
}


function formatIncidentDelay(delay) {

    if (delay === null || delay === undefined || delay === "") {
        return "غير متاح";
    }

    const seconds = Number(delay);

    if (!Number.isFinite(seconds)) {
        return String(delay);
    }

    const minutes = Math.round(seconds / 60);

    if (minutes <= 0) {
        return "أقل من دقيقة";
    }

    return `${minutes} دقيقة`;
}


async function toggleTrafficIncidents(button) {

    if (trafficIncidentsVisible) {

        trafficIncidentsVisible = false;
        trafficIncidentRequestId++;
        clearTrafficIncidents();
        button.classList.remove("active");
        return;
    }

    trafficIncidentsVisible = true;
    button.classList.add("active");

    await loadTrafficIncidents();
}


async function loadTrafficIncidents() {

    const requestId = ++trafficIncidentRequestId;

    clearTrafficIncidents();

    const bounds = map.getBounds();

    const bbox = [
        bounds.getWest(),
        bounds.getSouth(),
        bounds.getEast(),
        bounds.getNorth()
    ].join(",");

    const fields =
        "{incidents{type,geometry{type,coordinates},properties{iconCategory,magnitudeOfDelay,events{description,code,iconCategory},startTime,endTime,from,to,length,delay,roadNumbers}}}";

    const url =
        "https://api.tomtom.com/traffic/services/5/incidentDetails" +
        `?bbox=${encodeURIComponent(bbox)}` +
        `&fields=${encodeURIComponent(fields)}` +
        "&language=ar" +
        "&timeValidityFilter=present" +
        `&key=${TOMTOM_KEY}`;

    try {

        const response = await fetch(url);

        const data = await response.json();

        if (requestId !== trafficIncidentRequestId || !trafficIncidentsVisible) {
            return;
        }

        if (!response.ok) {
            throw new Error(
                data?.error?.description ||
                data?.error?.message ||
                "تعذر تحميل حالة الطريق."
            );
        }

        const incidents = Array.isArray(data?.incidents)
            ? data.incidents
            : [];

        if (!incidents.length) {
            alert("لا توجد حوادث أو مشاكل مرورية مسجلة حاليًا في المنطقة الظاهرة.");
            return;
        }

        incidents.forEach(incident => {

            const point = getIncidentPoint(incident.geometry);

            if (!point) {
                return;
            }

            const info = getTrafficIncidentInfo(incident);

            const icon = L.divIcon({
                className: "traffic-incident-marker",
                html: `
                    <div class="traffic-incident-icon" title="${info.title}">
                        ${info.icon}
                    </div>
                `,
                iconSize: [38, 38],
                iconAnchor: [19, 19],
                popupAnchor: [0, -20]
            });

            const marker = L.marker(point, { icon })
                .addTo(map);

            const popup = `
                <div class="traffic-popup">
                    <div class="traffic-popup-title">
                        ${info.icon} ${info.title}
                    </div>

                    <div class="traffic-popup-row">
                        <span>الحالة</span>
                        <span class="traffic-status">⚠️ موجودة حاليًا</span>
                    </div>

                    <div class="traffic-popup-row">
                        <span>التفاصيل</span>
                        <b>${info.description}</b>
                    </div>

                    ${info.delay !== undefined && info.delay !== null ? `
                        <div class="traffic-popup-row">
                            <span>التأخير المتوقع</span>
                            <b>${formatIncidentDelay(info.delay)}</b>
                        </div>
                    ` : ""}

                    ${info.roadNumbers ? `
                        <div class="traffic-popup-row">
                            <span>الطريق</span>
                            <b>${info.roadNumbers}</b>
                        </div>
                    ` : ""}

                    ${info.from ? `
                        <div class="traffic-popup-row">
                            <span>من</span>
                            <b>${info.from}</b>
                        </div>
                    ` : ""}

                    ${info.to ? `
                        <div class="traffic-popup-row">
                            <span>إلى</span>
                            <b>${info.to}</b>
                        </div>
                    ` : ""}
                </div>
            `;

            marker.bindPopup(popup);
            trafficIncidentLayers.push(marker);

            // Draw the affected road section when geometry is a line.
            const geometry = incident.geometry;

            if (geometry?.type === "LineString" && Array.isArray(geometry.coordinates)) {

                const points = geometry.coordinates
                    .filter(c => Array.isArray(c) && c.length >= 2)
                    .map(c => [c[1], c[0]]);

                if (points.length >= 2) {
                    const line = L.polyline(points, {
                        className: "traffic-incident-line",
                        color: "#d93025",
                        weight: 6,
                        opacity: .75
                    })
                    .addTo(map)
                    .bindPopup(popup);

                    trafficIncidentLayers.push(line);
                }
            }
        });

    }
    catch (error) {

        console.error("Traffic incidents error:", error);

        if (requestId !== trafficIncidentRequestId) {
            return;
        }

        trafficIncidentsVisible = false;

        const button = document.getElementById("traffic-incidents-btn");

        if (button) {
            button.classList.remove("active");
        }

        clearTrafficIncidents();

        alert(
            error.message ||
            "تعذر تحميل حالة الطريق."
        );
    }
}


/* =========================================================
   ROAD STATUS + CONGESTION HELPERS
========================================================= */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function classifyCongestion(currentSpeed, freeFlowSpeed) {

    const current = Number(currentSpeed);
    const freeFlow = Number(freeFlowSpeed);

    if (!Number.isFinite(current) || !Number.isFinite(freeFlow) || freeFlow <= 0) {
        return {
            label: "غير متاح",
            icon: "❓",
            className: "warning",
            ratio: null
        };
    }

    const ratio = current / freeFlow;

    if (current <= 5 || ratio < 0.40) {
        return {
            label: "زحمة شديدة",
            icon: "🔴",
            className: "danger",
            ratio
        };
    }

    if (ratio < 0.65) {
        return {
            label: "زحمة",
            icon: "🟠",
            className: "danger",
            ratio
        };
    }

    if (ratio < 0.80) {
        return {
            label: "حركة متوسطة",
            icon: "🟡",
            className: "warning",
            ratio
        };
    }

    return {
        label: "الطريق سالك",
        icon: "🟢",
        className: "good",
        ratio
    };
}


function getRoadStatusFromIncident(incident) {

    const properties = incident?.properties || {};
    const events = Array.isArray(properties.events)
        ? properties.events
        : [];

    const event = events[0] || {};

    const iconCategory = Number(
        properties.iconCategory ?? event.iconCategory
    );

    const eventText = events
        .map(item => `${item?.description || ""} ${item?.code || ""}`)
        .join(" ")
        .toLowerCase();

    // Priority: closure > accident > lane closure > road works > broken vehicle.
    if (iconCategory === 8 || /road ?closed|road closure|closed|closure|مغلق|إغلاق/.test(eventText)) {
        return {
            label: "الطريق مقفول",
            icon: "⛔",
            className: "danger"
        };
    }

    if (iconCategory === 1 || /accident|حادث|collision|تصادم/.test(eventText)) {
        return {
            label: "يوجد حادث",
            icon: "🚨",
            className: "danger"
        };
    }

    if (iconCategory === 7 || /lane closed|حارة مغلقة/.test(eventText)) {
        return {
            label: "حارة مغلقة",
            icon: "🚧",
            className: "warning"
        };
    }

    if (iconCategory === 9 || /road ?work|roadworks|works|أعمال طرق|صيانة|إصلاح/.test(eventText)) {
        return {
            label: "أعمال طرق / إصلاحات",
            icon: "🚧",
            className: "warning"
        };
    }

    if (iconCategory === 14 || /broken down|breakdown|broken|تعطل|متعطلة|مركبة/.test(eventText)) {
        return {
            label: "مركبة متعطلة",
            icon: "🚙",
            className: "warning"
        };
    }

    // A jam is handled separately by speed/free-flow, so it is not a road closure.
    if (iconCategory === 6 || /jam|traffic jam|ازدحام|زحام/.test(eventText)) {
        return {
            label: "الطريق طبيعي",
            icon: "🟢",
            className: "good"
        };
    }

    return {
        label: "يوجد حدث على الطريق",
        icon: "⚠️",
        className: "warning"
    };
}

function getIncidentCoordinates(geometry) {

    if (!geometry || !geometry.coordinates) {
        return [];
    }

    const coordinates = geometry.coordinates;

    if (geometry.type === "Point") {
        return Array.isArray(coordinates) ? [coordinates] : [];
    }

    if (geometry.type === "LineString") {
        return Array.isArray(coordinates) ? coordinates : [];
    }

    if (geometry.type === "MultiLineString") {
        return Array.isArray(coordinates)
            ? coordinates.flat().filter(Boolean)
            : [];
    }

    return [];
}


function distanceInMeters(lat1, lon1, lat2, lon2) {

    const R = 6371000;
    const toRad = value => value * Math.PI / 180;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) ** 2;

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}


function findNearestIncident(incidents, lat, lon) {

    let nearest = null;
    let nearestDistance = Infinity;

    incidents.forEach(incident => {

        const coordinates = getIncidentCoordinates(incident.geometry);

        coordinates.forEach(coordinate => {

            if (!Array.isArray(coordinate) || coordinate.length < 2) {
                return;
            }

            const incidentLon = Number(coordinate[0]);
            const incidentLat = Number(coordinate[1]);

            if (!Number.isFinite(incidentLat) || !Number.isFinite(incidentLon)) {
                return;
            }

            const distance = distanceInMeters(
                lat,
                lon,
                incidentLat,
                incidentLon
            );

            if (distance < nearestDistance) {
                nearestDistance = distance;
                nearest = incident;
            }
        });
    });

    // Only consider an incident relevant to the clicked road if it is close enough.
    if (nearest && nearestDistance <= 700) {
        return {
            incident: nearest,
            distance: nearestDistance
        };
    }

    return null;
}


async function getNearbyRoadIncident(lat, lon) {

    const delta = 0.008;

    const bbox = [
        lon - delta,
        lat - delta,
        lon + delta,
        lat + delta
    ].join(",");

    const fields =
        "{incidents{type,geometry{type,coordinates},properties{iconCategory,magnitudeOfDelay,events{description,code,iconCategory},startTime,endTime,from,to,length,delay,roadNumbers}}}";

    const url =
        "https://api.tomtom.com/traffic/services/5/incidentDetails" +
        `?bbox=${encodeURIComponent(bbox)}` +
        `&fields=${encodeURIComponent(fields)}` +
        "&language=ar" +
        "&timeValidityFilter=present" +
        `&key=${TOMTOM_KEY}`;

    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
        throw new Error(
            data?.error?.description ||
            data?.error?.message ||
            "تعذر قراءة حالة الطريق"
        );
    }

    const incidents = Array.isArray(data?.incidents)
        ? data.incidents
        : [];

    return findNearestIncident(incidents, lat, lon);
}


/* =========================================================
   MAP CLICK
========================================================= */

map.on(
    "click",

    async function(event) {


        if (

            document
                .getElementById(
                    "navigation-ui"
                )
                .style
                .display ===
                "block"

        ) {

            return;

        }


        const lat =
            event.latlng.lat;


        const lon =
            event.latlng.lng;


        const requestId = ++popupRequestId;


        currentPopup =
            L.popup()

            .setLatLng(
                [lat, lon]
            )

            .setContent(

                `

                <div class="popup-data">

                    ⏳ جاري تحليل الموقع...

                </div>

                `

            )

            .openOn(map);


        try {


            /*
             * Reverse Geocoding
             */

            const geoURL =
                "https://nominatim.openstreetmap.org/reverse"
                +
                `?lat=${lat}`
                +
                `&lon=${lon}`
                +
                "&format=jsonv2"
                +
                "&accept-language=ar";


            const geoResponse =
                await fetch(geoURL);


            const geoData =
                await geoResponse.json();


            const locationName =
                geoData.display_name
                ?
                geoData.display_name
                    .split(",")
                    .slice(0, 2)
                    .join(",")
                :
                "موقع محدد";



            /*
             * Weather
             */

            const weatherURL =
                "https://api.openweathermap.org/data/2.5/weather"
                +
                `?lat=${lat}`
                +
                `&lon=${lon}`
                +
                `&appid=${WEATHER_KEY}`
                +
                "&units=metric"
                +
                "&lang=ar";


            const weatherResponse =
                await fetch(
                    weatherURL
                );


            const weather =
                await weatherResponse.json();



            /*
             * Traffic
             */

            const trafficURL =
                "https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/10/json"
                +
                `?point=${lat},${lon}`
                +
                `&key=${TOMTOM_KEY}`;


            const trafficResponse =
                await fetch(
                    trafficURL
                );


            const traffic =
                await trafficResponse.json();


            const temperature =
                weather.main
                ?
                weather.main.temp
                :
                "غير متاح";


            const weatherDescription =
                weather.weather
                ?
                weather.weather[0].description
                :
                "";


            const currentSpeed =
                traffic.flowSegmentData
                ?
                traffic.flowSegmentData
                    .currentSpeed
                :
                "غير متاح";


            const freeFlowSpeed =
                traffic.flowSegmentData
                ?
                traffic.flowSegmentData
                    .freeFlowSpeed
                :
                "غير متاح";


            // Determine congestion from current speed vs. free-flow speed.
            const congestion = classifyCongestion(
                currentSpeed,
                freeFlowSpeed
            );


            // Ask TomTom whether an active incident is affecting this point.
            let roadStatus = {
                label: "الطريق طبيعي",
                icon: "🟢",
                className: "good"
            };

            let nearbyIncident = null;

            try {
                nearbyIncident = await getNearbyRoadIncident(
                    lat,
                    lon
                );

                if (nearbyIncident?.incident) {
                    roadStatus = getRoadStatusFromIncident(
                        nearbyIncident.incident
                    );
                }
            }
            catch (incidentError) {
                console.warn(
                    "Road status lookup failed:",
                    incidentError
                );

                roadStatus = {
                    label: "تعذر التحقق",
                    icon: "❓",
                    className: "warning"
                };
            }


            // Ignore a late response if the user already clicked another location.
            if (requestId !== popupRequestId) {
                return;
            }


            currentPopup.setContent(

                `

                <div class="popup-data">

                    <div class="popup-title">

                        📍 ${locationName}

                    </div>


                    <div class="popup-traffic-status">
                        <span>🛣️ حالة الطريق</span>
                        <b class="traffic-status ${roadStatus.className}">
                            ${roadStatus.icon} ${escapeHtml(roadStatus.label)}
                        </b>
                    </div>

                    <div class="popup-traffic-status">
                        <span>🚦 حالة الزحمة</span>
                        <b class="traffic-status ${congestion.className}">
                            ${congestion.icon} ${escapeHtml(congestion.label)}
                        </b>
                    </div>


                    <div class="popup-divider"></div>

                    ${nearbyIncident?.incident ? `
                        <div class="popup-row">
                            <span>📌 التفاصيل</span>
                            <b>${escapeHtml(
                                getTrafficIncidentInfo(nearbyIncident.incident).description
                            )}</b>
                        </div>
                    ` : ""}

                    <div class="popup-row">

                        <span>
                            🌡️ الحرارة
                        </span>

                        <b>
                            ${temperature}°C
                        </b>

                    </div>


                    <div class="popup-row">

                        <span>
                            ⛅ الطقس
                        </span>

                        <b>
                            ${weatherDescription}
                        </b>

                    </div>


                    <div class="popup-row">

                        <span>
                            🚗 سرعة الطريق
                        </span>

                        <b>

                            ${currentSpeed}
                            كم/س

                        </b>

                    </div>


                    <div class="popup-row">

                        <span>
                            🛣️ السرعة الطبيعية
                        </span>

                        <b>

                            ${freeFlowSpeed}
                            كم/س

                        </b>

                    </div>

                    <div class="popup-row">
                        <span>📊 تقييم السرعة</span>
                        <b>
                            ${congestion.ratio !== null ? Math.round(congestion.ratio * 100) + "% من السرعة الطبيعية" : "غير متاح"}
                        </b>
                    </div>

                </div>

                `

            );


        }

        catch(error) {

            console.error(error);


            currentPopup.setContent(

                `

                <div class="popup-data">

                    ❌ تعذر تحميل بيانات الموقع

                </div>

                `

            );

        }

    }

);



/* =========================================================
   REFRESH TRAFFIC INCIDENTS WHEN MAP MOVES
========================================================= */

let trafficRefreshTimer = null;

map.on("moveend", function() {

    if (!trafficIncidentsVisible) {
        return;
    }

    clearTimeout(trafficRefreshTimer);

    trafficRefreshTimer = setTimeout(() => {
        loadTrafficIncidents();
    }, 400);
});


/* =========================================================
   CLOSE PLACE SUGGESTIONS
========================================================= */

document.addEventListener("click", function(event) {

    const insideSuggestion =
        event.target.closest(".place-suggestions") ||
        event.target.closest("#autocomplete");

    const insideSearchInput =
        event.target.closest("#main-search") ||
        event.target.closest("#start-point") ||
        event.target.closest("#end-point");

    if (!insideSuggestion && !insideSearchInput) {
        hideAllPlaceSuggestions();
    }
});


</script>
